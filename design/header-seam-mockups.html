<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trendloom — 상단 경계 해결 후보</title>
<style>
  :root {
    --lime: #dff24c; --pink: #f6c7dc; --blue: #4fa3e3; --mint: #c9f1de;
    --ink: #12120f; --paper: #14140f; --muted: #5c5c58; --line: rgba(18,18,15,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #eef1e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: var(--paper); padding: 32px 24px 80px;
  }
  h1.page-title { font-size: 20px; margin: 0 0 6px; }
  p.page-sub { margin: 0 0 28px; color: var(--muted); font-size: 13px; line-height: 1.6; max-width: 760px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(280px, 1fr)); gap: 24px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; max-width: 380px; } }

  .candidate-label { margin-bottom: 10px; }
  .candidate-label h2 { font-size: 14px; margin: 0 0 2px; }
  .candidate-label span { font-size: 11.5px; color: var(--muted); display:block; line-height:1.5; }

  .frame {
    width: 100%; height: 460px; background: #fff; border-radius: 30px;
    border: 8px solid var(--ink); overflow: hidden; position: relative;
    box-shadow: 0 20px 40px -16px rgba(0,0,0,0.35);
  }

  .logo-row { display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; padding: 16px 16px 0; }
  .logo { width:24px; height:24px; border-radius:8px; background:var(--ink); }
  .page-h { font-size: 15px; font-weight: 800; margin: 14px 0 0; padding: 0 16px; }
  .card { background:rgba(255,255,255,0.7); border:1.5px solid rgba(255,255,255,0.6); border-radius:18px;
    padding:14px; margin:16px; font-size:12px; color:var(--muted); backdrop-filter: blur(6px); }

  /* A: 헤더까지 색 확장 */
  .a-bg { height:100%; background: linear-gradient(180deg, var(--lime) 0%, rgba(223,242,76,0) 260px); }

  /* B: 둥근 인셋 카드 */
  .b-wrap { height:100%; padding-top: 8px; }
  .b-hero { margin: 12px; border-radius: 26px; padding-top: 10px;
    background: linear-gradient(180deg, rgba(223,242,76,0.85) 0%, rgba(223,242,76,0.15) 100%); }
  .b-hero .page-h { padding: 0 14px; margin-top: 6px; }
  .b-hero .card { margin: 14px; }

  /* C: 상단부터 옅게 페이드 인 */
  .c-bg { height:100%; background: linear-gradient(180deg, rgba(223,242,76,0) 0%, rgba(223,242,76,0.55) 90px, rgba(223,242,76,0) 320px); }
</style>
</head>
<body>

<h1 class="page-title">Trendloom — 상단 경계 해결 후보 3종</h1>
<p class="page-sub">
  지금은 로고/타이틀이 있는 흰 헤더 영역과, 그 아래 꽉 찬 색 배경이 만나는 자리에 색종이를 덧댄 듯한
  직각 경계선이 생겨요. 세 가지 방식으로 그 경계를 없애봤습니다.
</p>

<div class="grid" id="grid"></div>

<script>
const CANDIDATES = [
  {
    key: "a",
    label: "A · 헤더까지 색 확장",
    note: "로고/타이틀도 색 배경 위에 얹는다. 경계선 자체가 없어짐 — 화면 전체가 하나의 색 영역으로 시작해서 자연스럽게 흰색으로 풀림. 가장 심플하고 확실한 해결.",
    body: `
      <div class="a-bg">
        <div class="logo-row"><div class="logo"></div>Trendloom</div>
        <div class="page-h">발주 · 가격</div>
        <div class="card">발주 수량과 판매가를 정합니다</div>
        <div class="card">원가 · 35,000원</div>
      </div>
    `,
  },
  {
    key: "b",
    label: "B · 둥근 인셋 히어로 카드",
    note: "색을 화면 끝까지 안 붙이고, 여백을 두고 둥근 카드로 띄운다. '어쩌다 생긴 사각형'이 아니라 '의도적으로 놓은 카드'로 읽힘. 헤더는 그대로 흰색 유지.",
    body: `
      <div class="logo-row"><div class="logo"></div>Trendloom</div>
      <div class="b-wrap">
        <div class="b-hero">
          <div class="page-h">발주 · 가격</div>
          <div class="card">발주 수량과 판매가를 정합니다</div>
        </div>
        <div class="card">원가 · 35,000원</div>
      </div>
    `,
  },
  {
    key: "c",
    label: "C · 헤더 아래부터 옅게 페이드인",
    note: "헤더는 흰색 그대로 두되, 그 아래 색이 0에서 시작해 서서히 진해졌다가 다시 흐려짐. 직선 경계 대신 부드러운 입장/퇴장. 손은 가장 적게 대는 방식.",
    body: `
      <div class="c-bg">
        <div class="logo-row"><div class="logo"></div>Trendloom</div>
        <div class="page-h">발주 · 가격</div>
        <div class="card">발주 수량과 판매가를 정합니다</div>
        <div class="card">원가 · 35,000원</div>
      </div>
    `,
  },
];

const grid = document.getElementById("grid");
CANDIDATES.forEach((c) => {
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="candidate-label"><h2>${c.label}</h2><span>${c.note}</span></div>
    <div class="frame">${c.body}</div>
  `;
  grid.appendChild(wrap);
});
</script>
</body>
</html>
