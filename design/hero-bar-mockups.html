<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trendloom — 상단 히어로바 후보</title>
<style>
  :root {
    --lime: #dff24c;
    --pink: #f6c7dc;
    --blue: #4fa3e3;
    --mint: #c9f1de;
    --ink: #12120f;
    --paper: #14140f;
    --muted: #5c5c58;
    --line: rgba(18, 18, 15, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #eef1e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: var(--paper);
    padding: 32px 24px 80px;
  }
  h1.page-title { font-size: 20px; margin: 0 0 6px; }
  p.page-sub { margin: 0 0 28px; color: var(--muted); font-size: 13px; line-height: 1.6; max-width: 640px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(320px, 1fr));
    gap: 28px;
  }
  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
  }

  .candidate-label { margin-bottom: 8px; }
  .candidate-label h2 { font-size: 14px; margin: 0 0 2px; }
  .candidate-label span { font-size: 11.5px; color: var(--muted); }

  /* 폰 프레임 미니어처 */
  .frame {
    position: relative;
    width: 100%;
    max-width: 320px;
    height: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 30px;
    border: 8px solid var(--ink);
    overflow: hidden;
    box-shadow: 0 20px 40px -16px rgba(0,0,0,0.35);
  }
  .scroll {
    position: absolute;
    inset: 0;
    overflow-y: auto;
  }
  .content {
    padding: 16px;
    padding-top: 0;
  }
  .spacer-top { flex-shrink: 0; }

  .card {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 12px;
    font-size: 12px;
    line-height: 1.5;
  }
  .card h4 { margin: 0 0 6px; font-size: 13px; }
  .card p { margin: 0; color: var(--muted); }

  .logo {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--ink); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 14px; height: 14px; }

  /* ── 히어로바 후보 스타일 ── */
  .hero { position: sticky; top: 0; z-index: 10; }

  .hero-a {
    background: var(--ink);
    color: #fff;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
  }
  .hero-a .brand { font-weight: 800; font-size: 15px; }

  .hero-b {
    background: var(--lime);
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px;
    border-radius: 0 0 22px 22px;
  }
  .hero-b .left { display: flex; align-items: center; gap: 10px; }
  .hero-b .brand { font-weight: 800; font-size: 15px; color: var(--paper); }
  .hero-b .avatar {
    width: 30px; height: 30px; border-radius: 99px;
    background: var(--ink); display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700;
  }

  .hero-c {
    background: #fff;
    border-bottom: 2.5px solid var(--ink);
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
  }
  .hero-c .brand { font-weight: 800; font-size: 15px; }

  .hero-d {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    transition: background 0.2s ease;
  }
  .hero-d .left { display: flex; align-items: center; gap: 10px; }
  .hero-d .brand { font-weight: 800; font-size: 15px; color: var(--paper); }
  .hero-d .screen-tag {
    font-size: 10.5px; font-weight: 700; color: var(--paper);
    background: rgba(255,255,255,0.55); border: 1.5px solid var(--ink);
    padding: 3px 9px; border-radius: 99px;
  }
</style>
</head>
<body>

<h1 class="page-title">Trendloom — 상단 히어로바 후보 4종</h1>
<p class="page-sub">
  태그라인 문구("패션 MD의 시즌 기획 → ... 데이터와 AI로.")는 지우고, 대신 모든 화면에서 스크롤해도 안 내려가는
  고정 상단 바를 답니다. 오른쪽 카드 목록을 실제로 스크롤해서 바가 붙어있는 느낌을 확인해보세요.
</p>

<div class="grid" id="grid"></div>

<script>
const LOGO_SVG = `<svg viewBox="0 0 24 24" fill="none"><path d="M12 8.5V6.9a1.6 1.6 0 1 0-1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 8.5 5.4 14h13.2L12 8.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

const CANDIDATES = [
  {
    key: "a",
    label: "A · 블랙 미니멀 바",
    note: "하단 메뉴바와 대칭 — 블랙 바에 화이트 로고/워드마크만, 가장 절제된 형태",
    hero: `
      <div class="hero hero-a">
        <div class="logo" style="background:#fff;color:${'var(--ink)'}">${LOGO_SVG.replace('currentColor','#12120f')}</div>
        <span class="brand">Trendloom</span>
      </div>`,
  },
  {
    key: "b",
    label: "B · 라임 히어로 블록",
    note: "참고 이미지의 \"Welcome, Mike!\" 바 그대로 — 컬러 블록 + 아바타, 존재감 가장 큼",
    hero: `
      <div class="hero hero-b">
        <div class="left">
          <div class="logo">${LOGO_SVG.replace('currentColor','#fff')}</div>
          <span class="brand">Trendloom</span>
        </div>
        <div class="avatar">MD</div>
      </div>`,
  },
  {
    key: "c",
    label: "C · 화이트 + 블랙 보더",
    note: "네이티브 앱 내비게이션 바에 가장 가까운, 콘텐츠 방해 최소화",
    hero: `
      <div class="hero hero-c">
        <div class="logo">${LOGO_SVG.replace('currentColor','#fff')}</div>
        <span class="brand">Trendloom</span>
      </div>`,
  },
  {
    key: "d",
    label: "D · 화면별 컬러 반응형",
    note: "현재 탭 색(라임/핑크/블루/민트)을 그대로 히어로바에 반영 — 예시는 발주·가격(핑크) 화면",
    hero: `
      <div class="hero hero-d" style="background:var(--pink)">
        <div class="left">
          <div class="logo">${LOGO_SVG.replace('currentColor','#fff')}</div>
          <span class="brand">Trendloom</span>
        </div>
        <span class="screen-tag">발주 · 가격</span>
      </div>`,
  },
];

const CARDS = [
  ["스타일 보드", "레퍼런스를 모아 놓고 시즌 팔레트와 실루엣을 뽑아내기"],
  ["발주 · 가격", "발주량과 판매가를 잡고 판매율·재고·영업이익까지 시뮬레이션"],
  ["리뷰 분석", "사이즈·소재·불량 이슈를 뽑고 재생산 판단까지"],
  ["상품 태거", "이미지 한 장으로 속성 태깅 · 커머스 카피"],
  ["시나리오 16개", "영업이익 순으로 정렬된 발주 시나리오 목록"],
  ["손익 구성", "매출 · 채널 수수료 · 매출원가 · 영업이익 상세"],
];

const grid = document.getElementById("grid");
CANDIDATES.forEach((c) => {
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="candidate-label">
      <h2>${c.label}</h2>
      <span>${c.note}</span>
    </div>
    <div class="frame">
      <div class="scroll">
        ${c.hero}
        <div class="content">
          ${CARDS.map(([t, d]) => `<div class="card"><h4>${t}</h4><p>${d}</p></div>`).join("")}
        </div>
      </div>
    </div>
  `;
  grid.appendChild(wrap);
});
</script>
</body>
</html>
